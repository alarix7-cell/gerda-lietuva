<style id="gerda-enhancements">
  :root {
    --gerda-red:#b20d18;
    --gerda-dark:#111;
    --gerda-light:#f6f6f6;
  }
  #gerda-contact-bar {

  #gerda-contact-bar a {
    display:inline-flex; align-items:center; justify-content:center;

    color:#fff; text-decoration:none; font:600 14px/1 system-ui,sans-serif;
  }
  #gerda-contact-bar .call { background:var(--gerda-red); }
  #gerda-contact-bar .wa { background:#168b52; }
  #gerda-contact-bar .request { background:#fff; color:#111; }
  #gerda-toast {
    position:fixed; right:18px; bottom:78px; z-index:100000;
    display:none; max-width:360px; padding:14px 16px; border-radius:9px;
    background:#111;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.25);
    font:500 14px/1.45 system-ui,sans-serif;
  }
  @media(max-width:600px){
    #gerda-contact-bar a{padding:0 11px;font-size:13px}

</style>

<div id="gerda-contact-bar" aria-label="GERDA kontaktai">

  <a class="wa" href="https://wa.me/37000000000" target="_blank" rel="noopener">WhatsApp</a>
  <a class="request" href="#root" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Užklausa</a>
</div>
<div id="gerda-toast" role="status" aria-live="polite"></div>

<script id="gerda-enhancements-script">
(function(){
  // Prevent broken placeholder contacts from silently behaving as real contacts.
  var bar=document.getElementById('gerda-contact-bar');
  if(!bar) return;
  var placeholders=bar.querySelectorAll('a[href*="000000000"]');
  placeholders.forEach(function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      var t=document.getElementById('gerda-toast');
      t.textContent='Kontaktinį telefono / WhatsApp numerį reikia įrašyti į svetainę.';
      t.style.display='block';
      clearTimeout(window.__gerdaToast);
      window.__gerdaToast=setTimeout(function(){t.style.display='none'},3500);
    });
  });
})();
</script>
